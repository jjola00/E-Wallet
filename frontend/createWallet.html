<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Wallet - Ticketing DApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js@1.8.0/dist/web3.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav id="shared-nav">
        <a href="index.html" id="nav-home">Home</a>
        <a href="createWallet.html" id="nav-create-wallet">Create Wallet</a>
        <a href="checkBalance.html" id="nav-check-balance">Check Balance</a>
        <a href="buyTicket.html" id="nav-buy-ticket">Buy Ticket</a>
        <a href="transferTicket.html" id="nav-transfer-ticket">Transfer Ticket</a>
    </nav>

    <main>
        <div class="container mt-5">
            <h1 class="text-center mb-4">Create or Import Wallet</h1>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <ul class="nav nav-tabs mb-4" id="walletTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="create-tab" data-bs-toggle="tab" data-bs-target="#createWallet" type="button" role="tab" aria-controls="createWallet" aria-selected="true">Create Wallet</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="import-tab" data-bs-toggle="tab" data-bs-target="#importWallet" type="button" role="tab" aria-controls="importWallet" aria-selected="false">Import Wallet</button>
                                </li>
                            </ul>
                            <div class="tab-content" id="walletTabContent">
                                <div class="tab-pane fade show active" id="createWallet" role="tabpanel" aria-labelledby="create-tab">
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="password" placeholder="Enter a strong password">
                                    </div>
                                    <button id="createWalletButton" class="button w-100">
                                        <i class="fas fa-wallet me-2"></i>Create Wallet
                                    </button>
                                </div>
                                <div class="tab-pane fade" id="importWallet" role="tabpanel" aria-labelledby="import-tab">
                                    <div class="mb-3">
                                        <label for="keystoreFile" class="form-label">Upload Wallet File</label>
                                        <input type="file" class="form-control" id="keystoreFile" accept="application/json">
                                    </div>
                                    <button id="importWalletButton" class="button w-100">
                                        <i class="fas fa-file-import me-2"></i>Import Wallet
                                    </button>
                                </div>
                            </div>
                            <div id="walletDetails" class="mt-3"></div>
                            <div id="statusMessage" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 Ticketing DApp</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/createWallet.js"></script>
</html>
