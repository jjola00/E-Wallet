<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Wallet - Ticketing DApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js@1.8.0/dist/web3.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav id="shared-nav">
        <a href="index.html" id="nav-home">Home</a>
        <a href="createWallet.html" id="nav-create-wallet">Create Wallet</a>
        <a href="checkBalance.html" id="nav-check-balance">Check Balance</a>
        <a href="buyTicket.html" id="nav-buy-ticket">Buy Ticket</a>
        <a href="transferTicket.html" id="nav-transfer-ticket">Transfer Ticket</a>
    </nav>

    <main>
        <div class="container mt-5">
            <h1 class="text-center mb-4">Create or Import Wallet</h1>
            <ul class="nav nav-tabs" id="walletTabs">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" href="#createTab">Create Wallet</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#importTab">Import Wallet</a>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="createTab">
                    <div class="card shadow-sm mt-3">
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter password for keystore">
                            </div>
                            <button id="createWalletButton" class="btn btn-primary w-100 mb-3">
                                <i class="fas fa-wallet me-2"></i>Create Wallet
                            </button>
                            <div id="walletDetails" class="mt-3" style="display: none;">
                                <h4>Wallet Details</h4>
                                <p><strong>Address:</strong> <input type="text" class="form-control" id="walletAddress" readonly></p>
                                <p><strong>Keystore:</strong> <textarea class="form-control" id="keystore" rows="5" readonly></textarea></p>
                            </div>
                            <div id="statusMessage"></div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="importTab">
                    <div class="card shadow-sm mt-3">
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="importPrivateKey" class="form-label">Private Key</label>
                                <input type="text" class="form-control" id="importPrivateKey" placeholder="Enter private key">
                            </div>
                            <div class="mb-3">
                                <label for="importPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="importPassword" placeholder="Enter password for new keystore">
                            </div>
                            <button id="importWalletButton" class="btn btn-primary w-100 mb-3">
                                <i class="fas fa-file-import me-2"></i>Import Wallet
                            </button>
                            <div id="walletDetails" class="mt-3" style="display: none;">
                                <h4>Wallet Details</h4>
                                <p><strong>Address
